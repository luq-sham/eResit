<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>myResit Sekolah</title>

  <base href="/" />

  <!-- Light only: the app ships no dark palette, so "light dark" just turned native controls and scrollbars dark. -->
  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <!-- Zoom stays enabled (accessibility). Input focus-zoom is prevented by 16px fields instead. -->
  <!-- Browser chrome / status bar match the page background: pages have no coloured top bar. -->
  <meta name="theme-color" content="#e9eaef" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="ico" href="assets/receipt-icon.ico" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
