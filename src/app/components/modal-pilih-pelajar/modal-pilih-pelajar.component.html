<ion-header class="modal-header ion-no-border">
  <ion-toolbar color="main">
    <ion-title>{{title}}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onSimpan(false)" aria-label="Tutup">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Search stays pinned above the list so it's reachable after scrolling. -->
  <ion-toolbar class="picker-search">
    <app-search-bar (onSearchEvent)="onSearch($event)" [categoryList]="categories"></app-search-bar>
    <p class="modal-intro picker-hint">
      Pilih satu {{isKakitangan ? 'kakitangan' : 'pelajar'}} daripada senarai, kemudian tekan butang Pilih.
    </p>
  </ion-toolbar>
</ion-header>

<ion-content class="picker-list">
  <app-table [tableHeader]="tableHeader" [isLoading]="isLoading" [tableData]="tableData" [showPaging]="false"
    [showBilangan]="false" (radioChange)="onRadioChange($event)" [hasTableTitle]="false"></app-table>
</ion-content>

<ion-footer class="modal-footer ion-no-border">
  <ion-toolbar>
    <div class="modal-actions">
      <span class="selection" aria-live="polite">
        <ng-container *ngIf="selectedData; else none">
          Dipilih: <strong>{{selectedData?.namaPelajar || selectedData?.namaKakitangan}}</strong>
        </ng-container>
        <ng-template #none>Belum ada pilihan</ng-template>
      </span>
      <ion-button fill="outline" color="medium" (click)="onSimpan(false)">Batal</ion-button>
      <ion-button class="primary-action" color="tertiary" (click)="onSimpan(true)" [disabled]="selectedData == null">
        Pilih
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
