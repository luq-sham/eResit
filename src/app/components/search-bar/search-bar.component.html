<div class="search-bar" role="search">
  <ion-select [(ngModel)]="category" interface="popover" class="search-field search-category" aria-label="Cari mengikut">
    <ion-select-option *ngFor="let item of categoryList" [value]="item.value">{{item.label}}</ion-select-option>
  </ion-select>

  <ion-input [(ngModel)]="searchText" placeholder="Carian..." [clearInput]="true" (keyup.enter)="onSearch()"
    class="search-field search-text" aria-label="Kata carian" enterkeyhint="search">
    <ion-icon slot="start" name="search-outline" color="medium" aria-hidden="true"></ion-icon>
  </ion-input>

  <ion-button color="tertiary" (click)="onSearch()" class="search-btn">
    <ion-icon name="search" slot="start" aria-hidden="true"></ion-icon>
    Cari
  </ion-button>
</div>
