<ion-header class="modal-header ion-no-border">
  <ion-toolbar color="main">
    <ion-title>{{isEdit ? 'Kemaskini Kakitangan' : 'Tambah Kakitangan'}}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onSimpan(false)" aria-label="Tutup">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="modal-intro">Medan bertanda <span class="text-danger">*</span> wajib diisi.</p>
  <app-dynamic-form [form]="form" [formConfig]="formConfig" [validations]="validations" [submitted]="submitted"
    (enterSubmit)="onSimpan(true)"></app-dynamic-form>
</ion-content>

<ion-footer class="modal-footer ion-no-border">
  <ion-toolbar>
    <div class="modal-actions">
      <ion-button *ngIf="isEdit" fill="outline" color="danger" (click)="onDelete(dataEdit)" [disabled]="saving">
        <ion-icon slot="start" name="trash-outline" aria-hidden="true"></ion-icon>
        Hapus
      </ion-button>
      <span class="spacer"></span>
      <ion-button fill="outline" color="medium" (click)="onSimpan(false)" [disabled]="saving">Batal</ion-button>
      <ion-button class="primary-action" color="tertiary" (click)="onSimpan(true)" [disabled]="saving">
        <ion-spinner *ngIf="saving" slot="start" name="crescent"></ion-spinner>
        {{saving ? 'Menyimpan...' : (isEdit ? 'Simpan Perubahan' : 'Tambah Kakitangan')}}
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
