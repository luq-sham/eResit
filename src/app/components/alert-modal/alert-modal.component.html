<div class="alert-body">
  <div class="icon-container" [ngClass]="alertType" aria-hidden="true">
    <ng-container [ngSwitch]="alertType">
      <ion-icon name="alert-circle" *ngSwitchCase="'warning'"></ion-icon>
      <ion-icon name="checkmark-circle" *ngSwitchCase="'success'"></ion-icon>
      <ion-icon name="close-circle" *ngSwitchCase="'danger'"></ion-icon>
    </ng-container>
  </div>

  <h2 class="alert-title" [id]="idBase + '-title'">{{header || 'Perhatian'}}</h2>
  <div class="alert-message" [id]="idBase + '-message'" [innerHTML]="message"></div>
</div>

<div class="alert-actions">
  <ion-button fill="outline" color="medium" (click)="dismiss()">
    {{cancelBtn || 'Tutup'}}
  </ion-button>

  <ion-button *ngIf="hasConfirm" fill="solid" [color]="alertType === 'danger' ? 'danger' : 'tertiary'" (click)="confirm()">
    {{confirmBtn || 'Ya'}}
  </ion-button>
</div>
