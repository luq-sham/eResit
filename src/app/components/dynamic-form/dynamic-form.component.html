<form [formGroup]="form" [class.was-submitted]="submitted" (keydown.enter)="onEnter($event)" novalidate>
  <ion-row class="input-form-row">
    <ion-col *ngFor="let formItem of formConfig" size="12" [sizeMd]="formItem?.size || 12">
      <ion-label class="form-label" [class.required]="isRequired(formItem.formControl)">{{formItem.label}}</ion-label>

      <ion-input *ngIf="formItem.type !== 'textarea'" class="form-control" [type]="formItem.type"
        [formControlName]="formItem.formControl" [attr.aria-label]="formItem.label"
        [attr.inputmode]="formItem.inputmode || null" [autocomplete]="formItem.autocomplete || 'off'"
        [placeholder]="formItem.placeholder || ''" [autocapitalize]="formItem.autocapitalize || 'off'"
        enterkeyhint="done"></ion-input>

      <ion-textarea *ngIf="formItem.type === 'textarea'" class="form-control" rows="3" [autoGrow]="true"
        [formControlName]="formItem.formControl" [attr.aria-label]="formItem.label"
        [autocapitalize]="formItem.autocapitalize || 'none'"></ion-textarea>

      <span class="form-hint" *ngIf="formItem.hint">{{formItem.hint}}</span>

      <app-error-message *ngFor="let val of validations?.[formItem.formControl]"
        [field]="form.get(formItem.formControl)" [error]="val.error" [message]="val.message"
        [submitted]="submitted"></app-error-message>
    </ion-col>
  </ion-row>
</form>
