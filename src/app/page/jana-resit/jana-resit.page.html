<ion-content>
  <app-header [title]="'Jana Resit'" [showBackBtn]="true"></app-header>
  <div class="p-16">

    <ion-grid fixed>
      <app-header-title [title]="'Senarai Pembayaran'"
        [subtitle]="'Pilih pembayaran daripada senarai untuk dijana resit.'"></app-header-title>
    </ion-grid>

    <ion-grid fixed>
      <ion-row>
        <ion-col>
          <app-search-bar (onSearchEvent)="onSearch($event)"></app-search-bar>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col>
          <app-table [isLoading]="isLoading" [tableHeader]="tableHeader" [tableData]="tableData"
            [tablePaging]="tablePaging" (pageChange)="onPageChange($event)" (recordChange)="onRecordChange($event)"
            (onButtonClick)="onClick($event)"></app-table>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
